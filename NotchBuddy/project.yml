name: MochiAssistant
options:
  bundleIdPrefix: id.pcstudio
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/MochiAssistant.entitlements

schemes:
  MochiAssistant:
    build:
      targets:
        MochiAssistant: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  MochiAssistant:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: "Mochi Assistant"
        CFBundleDisplayName: "Mochi Assistant"
        CFBundleIdentifier: id.pcstudio.mochi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Mochi Assistant memerlukan izin AppleEvents untuk mengontrol aplikasi sistem dan terminal."
        NSAccessibilityUsageDescription: "Mochi Assistant memerlukan akses aksesibilitas untuk membaca konteks jendela aktif dan membantu otomatisasi antarmuka."
        NSMicrophoneUsageDescription: "Mochi Assistant memerlukan akses mikrofon untuk mendengarkan perintah suara dan wake word."
        NSScreenCaptureUsageDescription: "Mochi Assistant memerlukan izin tangkapan layar untuk verifikasi visual antarmuka."
        NSSpeechRecognitionUsageDescription: "Mochi Assistant memerlukan izin pengenalan suara untuk mengubah ucapan menjadi teks perintah."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.pcstudio.mochi
        PRODUCT_NAME: MochiAssistant
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

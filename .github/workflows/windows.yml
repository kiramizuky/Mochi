name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "windows/**"
      - "shared/**"
      - "scripts/gen-sounds.mjs"
      - "scripts/check-versions.mjs"
      - "scripts/check-browser-args.mjs"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "shared/**"
      - "scripts/gen-sounds.mjs"
      - "scripts/check-versions.mjs"
      - "scripts/check-browser-args.mjs"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Install front-end dependencies
        run: npm ci

      - name: Check versions agree
        run: node ../scripts/check-versions.mjs

      - name: Check WebView2 arguments match
        run: node ../scripts/check-browser-args.mjs

      - name: Check sound cues are present and current
        run: node ../scripts/gen-sounds.mjs --check

      - name: Type-check the front end
        run: npm run typecheck

      - name: Front-end tests
        run: npm test

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the front end and the hook
        run: npm run build

      - name: Verify the bundled assets
        shell: pwsh
        run: |
          $cues = Get-ChildItem dist/sounds/*.wav
          if ($cues.Count -ne 28) { throw "expected 28 sound cues in dist/sounds, found $($cues.Count)" }
          if (-not (Test-Path target/release/coucou-hook.exe)) { throw "coucou-hook.exe was not built" }
          Write-Host "$($cues.Count) cues and the relay are present."

      - name: Build the release app for the UI smoke test
        run: cargo build --release -p coucou --features custom-protocol

      - name: App smoke test (island, tray, settings, relay, file drop)
        run: npm run smoke:app

      - name: Relay smoke test with Coucou closed
        run: npm run smoke:hook

      - name: Refuse to ship a weakened WebView2 configuration
        shell: pwsh
        run: |
          $pattern = '--disable-features=[^"]*msSmartScreenProtection'
          $hits = Select-String -Path src-tauri/tauri.conf.json, src-tauri/src/lib.rs -Pattern $pattern
          if ($hits) {
            $hits | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "msSmartScreenProtection must never be disabled."
          }

      - name: Package the installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: npm run pack

      - name: Write checksums
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $installers = Get-ChildItem release/Coucou-Windows-*-setup.exe
          if (-not $installers) { throw "No versioned installer was produced." }
          $lines = foreach ($file in $installers) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-Windows-${{ github.sha }}
          path: |
            windows/release/Coucou-Windows-*-setup.exe
            windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

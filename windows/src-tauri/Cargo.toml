[package]
name = "mochi"
description = "Mochi for Windows — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production webview: embed ../dist instead of loading the Vite dev server.
# `tauri build` enables this automatically; a plain `cargo build` must pass it
# when the result is going to be run (see windows/scripts/smoke-app.ps1).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-updater = "2"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Verification only; the app itself lets tauri-plugin-updater check the
# signature before running an installer.
minisign-verify = "0.2"
base64 = "0.22"
